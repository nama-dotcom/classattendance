<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1>Class Attendance Tracker</h1>
      <p class="subtitle">Easily track and manage daily student attendance</p>
    </header>

    <!-- Top Stats Counter -->
    <section class="stats-container" aria-label="Attendance Statistics">
      <div class="stat-card total-card">
        <span class="stat-label">Total Records</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat-card present-card">
        <span class="stat-label">Present</span>
        <span class="stat-value" id="presentCount">0</span>
      </div>
      <div class="stat-card absent-card">
        <span class="stat-label">Absent</span>
        <span class="stat-value" id="absentCount">0</span>
      </div>
    </section>

    <!-- Main Content Grid -->
    <main class="main-layout">
      <!-- Record Form Card -->
      <section class="card form-card">
        <h2 id="formTitle">Add Attendance Record</h2>
        <form id="attendanceForm" autocomplete="off">
          <input type="hidden" id="recordId">

          <div class="form-group">
            <label for="studentName">Student Name <span class="required">*</span></label>
            <input 
              type="text" 
              id="studentName" 
              placeholder="e.g. Alex Johnson" 
              required
              maxlength="50"
            >
          </div>

          <div class="form-group">
            <label for="attendanceDate">Date <span class="required">*</span></label>
            <input 
              type="date" 
              id="attendanceDate" 
              required
            >
          </div>

          <div class="form-group">
            <label for="attendanceStatus">Attendance Status <span class="required">*</span></label>
            <select id="attendanceStatus" required>
              <option value="" disabled selected>Select status</option>
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span id="submitBtnText">Add Record</span>
            </button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display: none;">
              Cancel
            </button>
          </div>
        </form>
      </section>

      <!-- Records List Card -->
      <section class="card list-card">
        <div class="list-header">
          <h2>Attendance Log</h2>
          <!-- Search & Filter Controls -->
          <div class="controls-wrapper">
            <div class="search-box">
              <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
              <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by student name..." 
                aria-label="Search records by student name"
              >
              <button type="button" id="clearSearchBtn" class="clear-btn" aria-label="Clear search" style="display: none;">&times;</button>
            </div>
            
            <select id="statusFilter" class="filter-select" aria-label="Filter by status">
              <option value="All">All Statuses</option>
              <option value="Present">Present Only</option>
              <option value="Absent">Absent Only</option>
            </select>
          </div>
        </div>

        <!-- Attendance Records Container -->
        <div id="recordsContainer" class="records-container">
          <!-- Populated by JavaScript -->
        </div>

        <!-- Friendly Empty State Message -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-icon">📋</div>
          <h3 id="emptyTitle">No attendance records yet</h3>
          <p id="emptyMessage">Use the form to record student attendance for today.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
